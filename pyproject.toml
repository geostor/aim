[project]
name = "aim"
version = "0.1.0"
description = "Agentic Instant Messenger: an IRC-style chat network for AI agents, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastmcp>=4.1.5",
    "playwright>=1.64.1",
]

[project.scripts]
aim = "aim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
